<text x="104" y="88" text-anchor="start" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="10" letter-spacing="3" fill="#7a6450">A. M. SOUZA</text><text x="796" y="88" text-anchor="end" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="10" letter-spacing="3" fill="#7a6450">BACKGROUND</text>
<line x1="104" y1="98" x2="796" y2="98" stroke="#9a7a45" stroke-width="0.6"/>
<text x="450" y="144" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="13" letter-spacing="6" fill="#7a1424">CHAPTER I</text><text x="450" y="198" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Segoe UI Symbol','DejaVu Sans',serif" font-size="44" fill="#2b1d14">𝕭𝖆𝖈𝖐𝖌𝖗𝖔𝖚𝖓𝖉</text><g stroke="#9a7a45" stroke-width="1" fill="none">
    <line x1="320" y1="224" x2="428" y2="224"/>
    <line x1="472" y1="224" x2="580" y2="224"/>
    <path d="M428 224 Q439 215 450 224 Q461 215 472 224"/>
    <path d="M428 224 Q439 233 450 224 Q461 233 472 224"/>
  </g><path d="M450 220 L454 224 L450 228 L446 224 Z" fill="#7a1424"/><path d="M314 221.5 L316.5 224 L314 226.5 L311.5 224 Z" fill="#9a7a45"/><path d="M586 221.5 L588.5 224 L586 226.5 L583.5 224 Z" fill="#9a7a45"/>
<rect x="104" y="271" width="68" height="68" fill="#7a1424"/>
        <rect x="107" y="274" width="62" height="62" fill="none" stroke="#9a7a45" stroke-width="1.2"/>
        <text x="138" y="321.32" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Segoe UI Symbol','DejaVu Sans',serif" font-size="48.96" fill="#f1e4c6">𝕭</text><text y="285" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="184.0">ackend</tspan><tspan x="246.9">developer</tspan><tspan x="330.0">since</tspan><tspan x="377.9">2020,</tspan><tspan x="431.9">in</tspan><tspan x="456.4">Brazil</tspan><tspan x="510.0">and</tspan><tspan x="547.9">then</tspan><tspan x="591.5">Germany.</tspan><tspan x="675.0">I've</tspan><tspan x="711.5">worked</tspan><tspan x="776.8">on</tspan></text><text y="312" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="184.0">financial</tspan><tspan x="258.5">reconciliation,</tspan><tspan x="375.6">Kafka</tspan><tspan x="428.4">consumers</tspan><tspan x="519.2">for</tspan><tspan x="550.0">stock</tspan><tspan x="598.5">exchange</tspan><tspan x="677.6">orders,</tspan><tspan x="739.8">and</tspan><tspan x="777.4">an</tspan></text><text y="339" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="184.0">encrypted</tspan><tspan x="268.6">email</tspan><tspan x="319.9">platform</tspan><tspan x="395.3">running</tspan><tspan x="465.5">on</tspan><tspan x="494.4">NATS</tspan><tspan x="548.7">JetStream</tspan><tspan x="635.4">with</tspan><tspan x="678.4">mTLS</tspan><tspan x="733.4">between</tspan></text><text x="104" y="366" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">tenants.</text>
<text x="104" y="407" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">A few things from that work that stuck with me:</text>
<path d="M111 438 L115 442 L111 446 L107 442 Z" fill="#7a1424"/><text y="448" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Synchronous</tspan><tspan x="232.7">deletes</tspan><tspan x="289.8">on</tspan><tspan x="313.7">a</tspan><tspan x="326.9">60</tspan><tspan x="351.6">GB</tspan><tspan x="379.8">object</tspan><tspan x="429.9">store</tspan><tspan x="472.1">were</tspan><tspan x="512.7">blocking</tspan><tspan x="581.4">NATS</tspan><tspan x="630.6">and</tspan><tspan x="663.6">taking</tspan><tspan x="715.5">the</tspan><tspan x="744.1">service</tspan></text><text x="130" y="475" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">down for about two hours a day. Moving the deletes to an async queue made it go away.</text><path d="M111 500 L115 504 L111 508 L107 504 Z" fill="#7a1424"/><text y="510" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">For</tspan><tspan x="160.5">an</tspan><tspan x="183.3">OTP</tspan><tspan x="221.1">replay</tspan><tspan x="272.0">bug,</tspan><tspan x="308.7">the</tspan><tspan x="336.9">quick</tspan><tspan x="382.2">fix</tspan><tspan x="405.5">was</tspan><tspan x="438.1">an</tspan><tspan x="460.9">in-memory</tspan><tspan x="549.2">cache</tspan><tspan x="595.5">of</tspan><tspan x="614.4">used</tspan><tspan x="653.6">codes.</tspan><tspan x="704.6">I</tspan><tspan x="715.5">pushed</tspan><tspan x="774.3">for</tspan></text><text y="537" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">storing</tspan><tspan x="188.8">them</tspan><tspan x="233.6">in</tspan><tspan x="254.5">the</tspan><tspan x="284.3">database</tspan><tspan x="356.5">instead,</tspan><tspan x="421.7">so</tspan><tspan x="444.0">a</tspan><tspan x="458.4">restart</tspan><tspan x="514.0">or</tspan><tspan x="536.0">a</tspan><tspan x="550.4">second</tspan><tspan x="608.4">instance</tspan><tspan x="677.0">couldn't</tspan><tspan x="743.7">reopen</tspan></text><text x="130" y="564" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">the hole.</text><path d="M111 589 L115 593 L111 597 L107 593 Z" fill="#7a1424"/><text y="599" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">I've</tspan><tspan x="162.4">also</tspan><tspan x="197.8">fixed</tspan><tspan x="240.3">an</tspan><tspan x="264.4">XSS,</tspan><tspan x="305.6">a</tspan><tspan x="319.6">data</tspan><tspan x="357.8">leak</tspan><tspan x="394.1">through</tspan><tspan x="459.7">an</tspan><tspan x="483.8">API</tspan><tspan x="517.7">response</tspan><tspan x="590.1">and</tspan><tspan x="624.0">an</tspan><tspan x="648.0">antivirus</tspan><tspan x="720.5">bypass</tspan><tspan x="776.8">on</tspan></text><text x="130" y="626" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">file uploads.</text>
<line x1="158" y1="652" x2="158" y2="708" stroke="#7a1424" stroke-width="2"/><text x="174" y="670" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="18" fill="#5a3e2b">The security bugs are the part I liked most, and it's where I want to</text><text x="174" y="698" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="18" fill="#5a3e2b">keep going.</text>

<text x="450" y="768" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="13" fill="#7a6450">· ii ·</text>
</svg>
