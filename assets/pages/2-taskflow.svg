<text x="104" y="88" text-anchor="start" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="10" letter-spacing="3" fill="#7a6450">A. M. SOUZA</text><text x="796" y="88" text-anchor="end" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="10" letter-spacing="3" fill="#7a6450">TASKFLOW</text>
