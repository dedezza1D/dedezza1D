  </g><path d="M450 220 L454 224 L450 228 L446 224 Z" fill="#7a1424"/><path d="M314 221.5 L316.5 224 L314 226.5 L311.5 224 Z" fill="#9a7a45"/><path d="M586 221.5 L588.5 224 L586 226.5 L583.5 224 Z" fill="#9a7a45"/>
<text x="450" y="262" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="15" fill="#7a6450">Go · React/TypeScript</text>
<rect x="104" y="305" width="68" height="68" fill="#7a1424"/>
        <rect x="107" y="308" width="62" height="62" fill="none" stroke="#9a7a45" stroke-width="1.2"/>
        <text x="138" y="355.32" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Segoe UI Symbol','DejaVu Sans',serif" font-size="48.96" fill="#f1e4c6">𝕸</text><text y="319" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="184.0">y</tspan><tspan x="196.5">first</tspan><tspan x="231.3">real</tspan><tspan x="264.1">Go</tspan><tspan x="289.7">project.</tspan><tspan x="351.0">It</tspan><tspan x="367.7">started</tspan><tspan x="424.4">as</tspan><tspan x="444.5">a</tspan><tspan x="457.2">task</tspan><tspan x="492.2">queue</tspan><tspan x="541.8">on</tspan><tspan x="565.2">NATS</tspan><tspan x="613.8">JetStream</tspan><tspan x="695.0">and</tspan><tspan x="727.5">Postgres,</tspan></text><text y="346" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="184.0">and</tspan><tspan x="218.3">I</tspan><tspan x="230.9">gave</tspan><tspan x="270.7">it</tspan><tspan x="287.5">a</tspan><tspan x="302.0">job</tspan><tspan x="331.6">to</tspan><tspan x="352.6">make</tspan><tspan x="399.4">it</tspan><tspan x="416.2">honest:</tspan><tspan x="478.0">you</tspan><tspan x="511.3">upload</tspan><tspan x="569.1">a</tspan><tspan x="583.6">PDF</tspan><tspan x="622.8">or</tspan><tspan x="644.9">a</tspan><tspan x="659.4">scan,</tspan><tspan x="703.6">it</tspan><tspan x="720.4">runs</tspan><tspan x="760.5">OCR</tspan></text><text y="373" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="184.0">(Tesseract),</tspan><tspan x="276.9">finds</tspan><tspan x="319.4">the</tspan><tspan x="348.1">personal</tspan><tspan x="417.8">data,</tspan><tspan x="460.0">writes</tspan><tspan x="510.7">a</tspan><tspan x="524.1">GDPR/LGPD</tspan><tspan x="629.9">report</tspan><tspan x="681.6">and</tspan><tspan x="714.8">deletes</tspan><tspan x="772.0">the</tspan></text><text x="104" y="400" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">original.</text>
<path d="M111 431 L115 435 L111 439 L107 435 Z" fill="#7a1424"/><text y="441" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Messages</tspan><tspan x="207.5">can</tspan><tspan x="240.0">arrive</tspan><tspan x="290.2">twice,</tspan><tspan x="340.3">so</tspan><tspan x="362.9">handlers</tspan><tspan x="434.6">are</tspan><tspan x="464.5">idempotent.</tspan><tspan x="562.0">Failed</tspan><tspan x="614.7">tasks</tspan><tspan x="659.0">retry</tspan><tspan x="701.5">with</tspan><tspan x="740.9">backoff</tspan></text><text x="130" y="468" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">and end up in a DLQ.</text><path d="M111 493 L115 497 L111 501 L107 497 Z" fill="#7a1424"/><text y="503" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">The</tspan><tspan x="163.2">task</tspan><tspan x="198.7">row</tspan><tspan x="231.9">doubles</tspan><tspan x="295.1">as</tspan><tspan x="315.6">an</tspan><tspan x="338.8">outbox.</tspan><tspan x="400.0">If</tspan><tspan x="416.7">the</tspan><tspan x="445.3">process</tspan><tspan x="506.3">dies</tspan><tspan x="541.2">between</tspan><tspan x="608.3">the</tspan><tspan x="636.9">Postgres</tspan><tspan x="705.4">commit</tspan><tspan x="767.6">and</tspan></text><text x="130" y="530" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">the NATS publish, it gets republished.</text><path d="M111 555 L115 559 L111 563 L107 559 Z" fill="#7a1424"/><text y="565" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Workers</tspan><tspan x="200.9">hold</tspan><tspan x="241.1">heartbeat</tspan><tspan x="319.3">leases,</tspan><tspan x="374.9">so</tspan><tspan x="397.9">a</tspan><tspan x="413.0">crashed</tspan><tspan x="478.0">worker's</tspan><tspan x="548.5">task</tspan><tspan x="585.9">gets</tspan><tspan x="622.5">picked</tspan><tspan x="678.5">up</tspan><tspan x="704.5">by</tspan><tspan x="728.9">someone</tspan></text><text x="130" y="592" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">else and never by two at once.</text><path d="M111 617 L115 621 L111 625 L107 621 Z" fill="#7a1424"/><text y="627" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">A</tspan><tspan x="150.1">16-digit</tspan><tspan x="216.2">number</tspan><tspan x="284.4">isn't</tspan><tspan x="324.9">a</tspan><tspan x="342.2">card</tspan><tspan x="383.8">number</tspan><tspan x="452.0">until</tspan><tspan x="496.1">it</tspan><tspan x="515.6">passes</tspan><tspan x="572.8">Luhn.</tspan><tspan x="626.0">Same</tspan><tspan x="676.0">idea</tspan><tspan x="716.2">for</tspan><tspan x="746.5">IBANs</tspan></text><text x="130" y="654" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">(mod-97) and CPF/CNPJ (mod-11).</text><path d="M111 679 L115 683 L111 687 L107 683 Z" fill="#7a1424"/><text x="130" y="689" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">Document text and PII never go into logs, traces, error messages or the DLQ.</text><path d="M111 714 L115 718 L111 722 L107 718 Z" fill="#7a1424"/><text y="724" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Ships</tspan><tspan x="177.7">as</tspan><tspan x="199.9">a</tspan><tspan x="214.7">server</tspan><tspan x="267.1">behind</tspan><tspan x="325.8">nginx,</tspan><tspan x="378.9">and</tspan><tspan x="413.6">as</tspan><tspan x="435.7">a</tspan><tspan x="450.6">desktop</tspan><tspan x="516.0">app</tspan><tspan x="550.2">for</tspan><tspan x="578.1">people</tspan><tspan x="634.2">who</tspan><tspan x="672.1">don't</tspan><tspan x="716.8">want</tspan><tspan x="760.1">their</tspan></text><text x="130" y="751" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">documents leaving the machine.</text><path d="M111 776 L115 780 L111 784 L107 780 Z" fill="#7a1424"/><text y="786" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Observability</tspan><tspan x="238.6">via</tspan><tspan x="268.9">OpenTelemetry/Prometheus/Grafana/Loki,</tspan><tspan x="607.4">integration</tspan><tspan x="699.0">tests</tspan><tspan x="742.0">against</tspan></text><text x="130" y="813" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">real Postgres in CI.</text>

<text x="450" y="869" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="13" fill="#7a6450">· iii ·</text>
