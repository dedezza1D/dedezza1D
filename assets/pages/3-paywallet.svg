<text x="450" y="262" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="15" fill="#7a6450">Java 21 · Spring Boot</text>
<rect x="104" y="305" width="68" height="68" fill="#7a1424"/>
        <rect x="107" y="308" width="62" height="62" fill="none" stroke="#9a7a45" stroke-width="1.2"/>
        <text x="138" y="355.32" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Segoe UI Symbol','DejaVu Sans',serif" font-size="48.96" fill="#f1e4c6">𝕬</text><text x="184" y="319" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">wallet with transfers, Pix and merchant charges.</text>
<path d="M111 404 L115 408 L111 412 L107 408 Z" fill="#7a1424"/><text y="414" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Double-entry</tspan><tspan x="239.2">ledger.</tspan><tspan x="299.6">A</tspan><tspan x="320.2">balance</tspan><tspan x="386.9">is</tspan><tspan x="408.3">never</tspan><tspan x="459.4">updated</tspan><tspan x="530.2">on</tspan><tspan x="558.5">its</tspan><tspan x="585.9">own:</tspan><tspan x="632.1">every</tspan><tspan x="681.4">transfer</tspan><tspan x="750.1">writes</tspan></text><text x="130" y="441" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">postings that sum to zero, and Postgres constraints reject anything that doesn't.</text><path d="M111 466 L115 470 L111 474 L107 470 Z" fill="#7a1424"/><text y="476" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">The</tspan><tspan x="163.6">Kafka</tspan><tspan x="212.2">event</tspan><tspan x="257.9">is</tspan><tspan x="275.3">written</tspan><tspan x="334.7">to</tspan><tspan x="354.7">an</tspan><tspan x="378.3">outbox</tspan><tspan x="435.4">table</tspan><tspan x="477.4">in</tspan><tspan x="497.4">the</tspan><tspan x="526.4">same</tspan><tspan x="570.4">transaction</tspan><tspan x="660.6">as</tspan><tspan x="681.5">the</tspan><tspan x="710.4">transfer,</tspan><tspan x="779.5">so</tspan></text><text x="130" y="503" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">there's no transfer without an event or event without a transfer.</text><path d="M111 528 L115 532 L111 536 L107 532 Z" fill="#7a1424"/><text y="538" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Feed</tspan><tspan x="173.6">in</tspan><tspan x="195.8">MongoDB,</tspan><tspan x="284.3">idempotency</tspan><tspan x="388.5">keys</tspan><tspan x="428.8">and</tspan><tspan x="464.4">daily</tspan><tspan x="508.2">limits</tspan><tspan x="558.4">in</tspan><tspan x="580.6">Redis,</tspan><tspan x="634.7">KYC</tspan><tspan x="675.1">documents</tspan><tspan x="765.2">in</tspan><tspan x="787.4">a</tspan></text><text x="130" y="565" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">private S3 bucket.</text><path d="M111 590 L115 594 L111 598 L107 594 Z" fill="#7a1424"/><text y="600" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">Access</tspan><tspan x="183.9">tokens</tspan><tspan x="237.8">are</tspan><tspan x="265.7">signed</tspan><tspan x="318.9">with</tspan><tspan x="356.3">RS256</tspan><tspan x="410.0">and</tspan><tspan x="442.6">published</tspan><tspan x="520.8">on</tspan><tspan x="544.2">a</tspan><tspan x="556.9">JWKS</tspan><tspan x="607.8">endpoint.</tspan><tspan x="684.3">Reusing</tspan><tspan x="749.4">an</tspan><tspan x="772.2">old</tspan></text><text y="627" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14"><tspan x="130.0">refresh</tspan><tspan x="189.6">token</tspan><tspan x="238.5">kills</tspan><tspan x="276.1">the</tspan><tspan x="306.5">whole</tspan><tspan x="357.7">session.</tspan><tspan x="423.2">Login</tspan><tspan x="472.8">runs</tspan><tspan x="513.4">BCrypt</tspan><tspan x="572.8">even</tspan><tspan x="614.2">for</tspan><tspan x="642.3">unknown</tspan><tspan x="719.5">emails,</tspan><tspan x="779.5">so</tspan></text><text x="130" y="654" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="17" fill="#2b1d14">response time doesn't tell you if an account exists.</text>

<text x="450" y="710" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-style="italic" font-size="13" fill="#7a6450">· iv ·</text>
