<text x="450" y="144" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="13" letter-spacing="6" fill="#7a1424">CHAPTER III</text><text x="450" y="198" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Segoe UI Symbol','DejaVu Sans',serif" font-size="44" fill="#2b1d14">𝕻𝖆𝖞𝖂𝖆𝖑𝖑𝖊𝖙</text><g stroke="#9a7a45" stroke-width="1" fill="none">
